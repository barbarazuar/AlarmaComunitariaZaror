spring.application.name=ms-usuarios
server.port=8081

# H2 guardada en archivo (carpeta backend/data): los datos no se pierden al reiniciar
spring.datasource.url=jdbc:h2:file:../data/usuarios-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# update = Hibernate crea o ajusta las tablas segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web para ver la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
